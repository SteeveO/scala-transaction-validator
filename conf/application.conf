# https://www.playframework.com/documentation/latest/ConfigFile
# The application secret used for signing session cookies and CSRF tokens.
# In production, override via the APPLICATION_SECRET environment variable.
play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

# No process manager relies on RUNNING_PID in a container — the container
# runtime itself is the process boundary — and writing it needs a writable
# app.home, which the non-root production image intentionally doesn't grant
# beyond what's chowned. Disabling it here (rather than only via a -D flag
# on the java command) makes it effective no matter how the jar is launched.
play.server.pidfile.path = "/dev/null"
