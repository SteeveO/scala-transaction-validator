services:
  app:
    build: .
    ports:
      - "${PORT:-9000}:9000"
    environment:
      APPLICATION_SECRET: ${APPLICATION_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
